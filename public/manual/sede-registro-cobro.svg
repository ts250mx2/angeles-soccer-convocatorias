<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" role="img"
     aria-label="Un jugador registrado en la sede Matriz que paga en San Nicolás: el reporte de Inscripciones lo cuenta en Matriz y el de Caja lo cuenta en San Nicolás.">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .lbl  { font-size: 10px;   font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
    .dato { font-size: 18px;   font-weight: 700; fill: #e2e8f0; }
    .tagA { font-size: 10.5px; font-weight: 700; fill: #93c5fd; }
    .tagB { font-size: 10.5px; font-weight: 700; fill: #6ee7b7; }
    .azT  { font-size: 12px;   font-weight: 700; fill: #dbeafe; }
    .azS  { font-size: 10.5px; fill: #93c5fd; }
    .veT  { font-size: 12px;   font-weight: 700; fill: #d1fae5; }
    .veS  { font-size: 10.5px; fill: #6ee7b7; }
    .caja { fill: #131f36; stroke: #2b3a52; }
    .flecha { stroke: #475569; stroke-width: 2; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="759" height="207" rx="16" fill="#0f172a" stroke="#1e293b"/>

  <!-- El jugador y la sede a la que pertenece -->
  <rect class="caja" x="32" y="48" width="190" height="112" rx="12"/>
  <text class="lbl"  x="52" y="76">JUGADOR</text>
  <text class="dato" x="52" y="108">Juan Pérez</text>
  <rect x="52" y="120" width="142" height="24" rx="6" fill="#10233f" stroke="#3b82f6"/>
  <text class="tagA" x="62" y="136">Registrado en MATRIZ</text>

  <path class="flecha" d="M232 104 H282"/>
  <polygon points="282,98 292,104 282,110" fill="#475569"/>

  <!-- Dónde pagó -->
  <rect class="caja" x="292" y="48" width="186" height="112" rx="12"/>
  <text class="lbl"  x="308" y="76">PAGO</text>
  <text class="dato" x="308" y="108">$1,800.00</text>
  <rect x="308" y="120" width="156" height="24" rx="6" fill="#052e21" stroke="#10b981"/>
  <text class="tagB" x="318" y="136">Cobrado en SAN NICOLÁS</text>

  <path class="flecha" d="M488 104 H528 M528 69 V139 M528 69 H538 M528 139 H538"/>
  <polygon points="538,64 546,69 538,74" fill="#475569"/>
  <polygon points="538,134 546,139 538,144" fill="#475569"/>

  <!-- El mismo pago, contado en dos sedes distintas -->
  <rect x="546" y="38" width="186" height="62" rx="12" fill="#10233f" stroke="#3b82f6"/>
  <text class="azT" x="566" y="63">Inscripciones por Sede</text>
  <text class="azS" x="566" y="81">lo cuenta en MATRIZ</text>

  <rect x="546" y="108" width="186" height="62" rx="12" fill="#052e21" stroke="#10b981"/>
  <text class="veT" x="566" y="133">Caja y Cortes por Sede</text>
  <text class="veS" x="566" y="151">lo cuenta en SAN NICOLÁS</text>
</svg>
