<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" role="img"
     aria-label="Un cobro capturado el 15 de julio de 2026 lleva sellada la temporada 2026-2027, y por eso aparece en el reporte de esa temporada y no en el de la anterior.">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .lbl  { font-size: 10px;   font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
    .dato { font-size: 21px;   font-weight: 700; fill: #e2e8f0; }
    .pie  { font-size: 11.5px; fill: #94a3b8; }
    .item { font-size: 13px;   fill: #cbd5e1; }
    .monto{ font-size: 15px;   font-weight: 700; fill: #e2e8f0; }
    .sello{ font-size: 11.5px; font-weight: 700; letter-spacing: .5px; fill: #93c5fd; }
    .okT  { font-size: 12px;   font-weight: 700; fill: #dbeafe; }
    .okS  { font-size: 10.5px; fill: #93c5fd; }
    .noT  { font-size: 12px;   font-weight: 700; fill: #64748b; }
    .noS  { font-size: 10.5px; fill: #475569; }
    .caja { fill: #131f36; stroke: #2b3a52; }
    .flecha { stroke: #475569; stroke-width: 2; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="759" height="207" rx="16" fill="#0f172a" stroke="#1e293b"/>

  <!-- Cuándo se cobró -->
  <rect class="caja" x="32" y="48" width="190" height="112" rx="12"/>
  <text class="lbl"  x="52" y="76">FECHA DEL COBRO</text>
  <text class="dato" x="52" y="112">15 jul 2026</text>
  <text class="pie"  x="52" y="136">se captura en julio</text>

  <path class="flecha" d="M232 104 H282"/>
  <polygon points="282,98 292,104 282,110" fill="#475569"/>

  <!-- El recibo y su sello -->
  <rect class="caja" x="292" y="34" width="186" height="140" rx="12"/>
  <text class="lbl"   x="308" y="62">RECIBO 4471</text>
  <text class="item"  x="308" y="88">Inscripción</text>
  <text class="monto" x="308" y="110">$1,800.00</text>
  <g transform="rotate(-4 385 141)">
    <rect x="306" y="124" width="158" height="34" rx="8" fill="#172554" stroke="#3b82f6"/>
    <text class="sello" x="385" y="146" text-anchor="middle">TEMPORADA 2026-2027</text>
  </g>

  <path class="flecha" d="M488 104 H528 M528 69 V139"/>
  <polygon points="538,64 546,69 538,74" fill="#475569"/>
  <polygon points="538,134 546,139 538,144" fill="#475569"/>
  <path class="flecha" d="M528 69 H538 M528 139 H538"/>

  <!-- Dónde termina apareciendo -->
  <rect x="546" y="38" width="186" height="62" rx="12" fill="#10233f" stroke="#3b82f6"/>
  <polyline points="562,68 568,74 580,61" fill="none" stroke="#34d399" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <text class="okT" x="590" y="63">Temporada 2026-2027</text>
  <text class="okS" x="590" y="81">aquí aparece el pago</text>

  <rect class="caja" x="546" y="108" width="186" height="62" rx="12"/>
  <path d="M564 133 L576 145 M576 133 L564 145" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <text class="noT" x="590" y="133">Temporada 2025-2026</text>
  <text class="noS" x="590" y="151">no lo cuenta</text>
</svg>
